<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A BIG FAMILY | Network</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2a2a2a;
            --accent: #4eb1f3;
            --text: #e0e0e0;
            --sidebar-w: 280px;
        }

        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }

        .container { display: grid; grid-template-columns: 1fr var(--sidebar-w); width: 100%; height: 100vh; }

        /* ЛЕВАЯ КОЛОНКА - КОНТЕНТ */
        .content-area { overflow-y: auto; background: #222; position: relative; padding-bottom: 80px; }

        .view-section { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .view-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ПОСТ ПАСТЫРЯ */
        .pastor-post { background: var(--card); border-radius: 8px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--accent); }
        .post-img { width: 100%; max-height: 450px; object-fit: cover; border-radius: 4px; margin: 10px 0; background: #111; }

        /* ПРАВАЯ КОЛОНКА - МЕНЮ */
        .sidebar { background: #111; display: flex; flex-direction: column; padding: 20px; gap: 12px; border-left: 1px solid #333; }

        .menu-item {
            background: #222; padding: 18px; border-radius: 6px; cursor: pointer;
            transition: 0.2s; text-align: left; text-transform: lowercase;
            font-size: 1.1rem; color: #888; border: 1px solid transparent;
        }

        .menu-item:hover { background: #282828; color: #fff; }
        .menu-item.active { background: #2b5278; color: #fff; border-color: var(--accent); }

        /* ЧАТЫ (Внутри вкладок) */
        .chat-wrap { display: flex; flex-direction: column; height: 70vh; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .input-wrap { padding: 15px; background: #222; display: flex; gap: 10px; }
        input { flex: 1; background: #333; border: none; padding: 12px; color: white; border-radius: 4px; outline: none; }
        
        .bubble { padding: 8px 12px; border-radius: 10px; max-width: 80%; font-size: 0.9rem; }
        .my { align-self: flex-end; background: #2b5278; }
        .other { align-self: flex-start; background: #333; }

        /* МОБИЛКИ */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed; bottom: 0; width: 100%; height: 65px;
                flex-direction: row; padding: 0; border-left: none; border-top: 1px solid #333;
            }
            .menu-item {
                flex: 1; border-radius: 0; font-size: 0.65rem; padding: 0;
                display: flex; align-items: center; justify-content: center;
            }
            .content-area { height: calc(100vh - 65px); }
            .sidebar-hide { display: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content-area">
            
            <section id="view-home" class="view-section active">
                <div id="pastor-feed">
                    <div class="pastor-post">
                        <div style="font-weight: bold; color: var(--accent);">Пастырь Official</div>
                        <p>Нажмите на "сообщество" или "анонимные чаты", чтобы начать общение.</p>
                    </div>
                </div>
            </section>

            <section id="view-anon" class="view-section">
                <h2>Анонимный Канал</h2>
                <div class="chat-wrap">
                    <div class="messages" id="anon-msgs"></div>
                    <div class="input-wrap">
                        <input type="text" id="anon-input" placeholder="Зашифрованное сообщение...">
                        <button onclick="sendMsg('anon')" style="background:var(--accent); border:none; padding:10px;">-></button>
                    </div>
                </div>
            </section>

            <section id="view-community" class="view-section">
                <h2>Общий чат Братства</h2>
                <div class="chat-wrap">
                    <div class="messages" id="pub-msgs"></div>
                    <div class="input-wrap">
                        <input type="text" id="pub-input" placeholder="Написать всем...">
                        <button onclick="sendMsg('pub')" style="background:var(--accent); border:none; padding:10px;">-></button>
                    </div>
                </div>
            </section>

            <section id="view-donate" class="view-section">
                <h2>Поддержка Братства</h2>
                <div class="pastor-post">
                    <p>Ваши пожертвования идут на развитие цифровой обители.</p>
                    <button style="width:100%; padding:15px; background:#f39c12; border:none; font-weight:bold; cursor:pointer;">ПОДДЕРЖАТЬ</button>
                </div>
            </section>

        </div>

        <nav class="sidebar">
            <button class="menu-item active" onclick="switchTab('home', this)">чаты</button>
            <button class="menu-item" onclick="switchTab('anon', this)">анонимные чаты</button>
            <button class="menu-item" onclick="switchTab('community', this)">сообщество</button>
            <button class="menu-item" onclick="switchTab('account', this)">аккаунт</button>
            <button class="menu-item" onclick="switchTab('profile', this)">профиль</button>
            <button class="menu-item" onclick="switchTab('donate', this)">донат</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7kRyiPzIAACu2RbUhl02oHdOVU8rltx8",
            authDomain: "bigfamily-9c7c9.firebaseapp.com",
            databaseURL: "https://bigfamily-9c7c9-default-rtdb.firebaseio.com",
            projectId: "bigfamily-9c7c9",
            storageBucket: "bigfamily-9c7c9.firebasestorage.app",
            messagingSenderId: "335887032766",
            appId: "1:335887032766:web:0767c05060af85723799ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const user = localStorage.getItem('chat_user') || "Гость_" + Math.floor(Math.random()*1000);

        // Переключение вкладок (Настоящее)
        window.switchTab = (id, el) => {
            // Убираем активный класс у кнопок
            document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');

            // Скрываем все секции и показываем нужную
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
        };

        // Отправка сообщений
        window.sendMsg = (type) => {
            const input = document.getElementById(type + '-input');
            if(!input.value.trim()) return;
            
            const msgRef = ref(db, 'messages/' + type);
            push(msgRef, {
                user: user,
                text: input.value,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            input.value = '';
        };

        // Получение сообщений (Общий чат)
        onChildAdded(ref(db, 'messages/pub'), (snap) => {
            renderBubble(snap.val(), 'pub-msgs');
        });

        // Получение сообщений (Анон чат)
        onChildAdded(ref(db, 'messages/anon'), (snap) => {
            renderBubble(snap.val(), 'anon-msgs');
        });

        // Получение постов ПАСТЫРЯ (Лента слева)
        onChildAdded(ref(db, 'pastor_posts'), (snap) => {
            const post = snap.val();
            const feed = document.getElementById('pastor-feed');
            const html = `
                <div class="pastor-post">
                    <div style="font-weight: bold; color: var(--accent);">Пастырь</div>
                    ${post.imgUrl ? `<img src="${post.imgUrl}" class="post-img">` : ''}
                    <p>${post.text}</p>
                    <small style="opacity:0.5;">${post.time || ''}</small>
                </div>`;
            feed.insertAdjacentHTML('afterbegin', html);
        });

        function renderBubble(data, containerId) {
            const box = document.getElementById(containerId);
            const isMy = data.user === user;
            box.innerHTML += `
                <div class="bubble ${isMy ? 'my' : 'other'}">
                    <div style="font-size:0.7rem; color:var(--accent); font-weight:bold;">${data.user}</div>
                    ${data.text}
                    <div style="font-size:0.6rem; opacity:0.5; text-align:right;">${data.time}</div>
                </div>`;
            box.parentNode.scrollTop = box.parentNode.scrollHeight;
        }
    </script>
</body>
</html>
