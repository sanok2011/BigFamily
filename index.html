<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A BIG FAMILY</title>
    <style>
        :root { --bg: #0e1621; --card: #17212b; --accent: #4eb1f3; --text: #f5f5f5; --sidebar-w: 250px; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
        .container { display: grid; grid-template-columns: 1fr var(--sidebar-w); width: 100%; height: 100vh; }

        /* ЭКРАНЫ */
        .content-area { overflow-y: auto; background: #0e1621; }
        .view-section { display: none; height: 100%; padding: 20px; box-sizing: border-box; flex-direction: column; }
        .view-section.active { display: flex; }

        /* МЕНЮ */
        .sidebar { background: #17212b; display: flex; flex-direction: column; padding: 15px; gap: 10px; border-left: 1px solid #000; }
        .menu-item { background: #242f3d; padding: 15px; border-radius: 8px; cursor: pointer; border: none; color: #888; text-align: left; font-size: 1rem; transition: 0.2s; }
        .menu-item.active { background: #2b5278; color: #fff; border-left: 4px solid var(--accent); }

        /* ЧАТЫ */
        .chat-wrap { display: flex; flex-direction: column; flex: 1; background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input-wrap { padding: 15px; background: #17212b; display: flex; gap: 10px; }
        input { background: #242f3d; border: 1px solid #333; padding: 12px; color: white; border-radius: 8px; outline: none; flex: 1; }
        .action-btn { background: var(--accent); border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .bubble { padding: 10px; border-radius: 10px; max-width: 85%; position: relative; }
        .my { align-self: flex-end; background: #2b5278; }
        .other { align-self: flex-start; background: #182533; }

        /* АВТОРИЗАЦИЯ */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: var(--card); padding: 30px; border-radius: 15px; width: 320px; display: flex; flex-direction: column; gap: 10px; }

        /* МОБИЛКИ */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { position: fixed; bottom: 0; width: 100%; height: 70px; flex-direction: row; padding: 5px; border-top: 1px solid #000; z-index: 100; }
            .menu-item { flex: 1; font-size: 0.6rem; padding: 5px; text-align: center; }
            .content-area { height: calc(100vh - 70px); }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="color:var(--accent); text-align:center;">A BIG FAMILY</h2>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-pass" placeholder="Пароль">
            <input type="text" id="auth-nick" placeholder="Никнейм (для новых)">
            <button class="action-btn" onclick="handleAuth('login')">ВХОД</button>
            <button class="action-btn" style="background:transparent; color:var(--accent); border:1px solid var(--accent);" onclick="handleAuth('reg')">РЕГИСТРАЦИЯ</button>
        </div>
    </div>

    <div class="container">
        <div class="content-area">
            <section id="view-home" class="view-section active">
                <h2 style="color:var(--accent)">ГЛАВНАЯ</h2>
                <div id="pastor-feed"></div>
            </section>

            <section id="view-forum" class="view-section">
                <h2>ОБЩИЙ ФОРУМ</h2>
                <div class="chat-wrap">
                    <div class="messages" id="forum-msgs"></div>
                    <div class="input-wrap">
                        <input type="text" id="forum-input" placeholder="Написать всем...">
                        <button onclick="sendGlobalMsg()" class="action-btn">-></button>
                    </div>
                </div>
            </section>

            <section id="view-anon" class="view-section" style="padding:0;">
                <div style="display:grid; grid-template-columns: 200px 1fr; height:100%;">
                    <div style="background:#111; padding:10px; border-right:1px solid #333;">
                        <input type="text" id="search-user" placeholder="Ник друга" style="width:90%;">
                        <div id="contacts" style="margin-top:10px;"></div>
                    </div>
                    <div class="chat-wrap" style="margin:0;">
                        <div class="messages" id="priv-msgs"></div>
                        <div class="input-wrap">
                            <input type="text" id="priv-input" placeholder="Личное сообщение...">
                            <button onclick="sendPrivateMsg()" class="action-btn">-></button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-profile" class="view-section">
                <div style="text-align:center; background:var(--card); padding:30px; border-radius:15px;">
                    <img id="u-avatar" src="https://via.placeholder.com/150" style="width:120px; height:120px; border-radius:50%; object-fit:cover;">
                    <h2 id="u-nick">...</h2>
                    <p id="u-email" style="opacity:0.6;"></p>
                    <input type="text" id="avatar-input" placeholder="URL аватарки" style="width:80%;">
                    <button class="action-btn" style="margin-top:10px;" onclick="updateAvatar()">ОБНОВИТЬ</button>
                </div>
            </section>

            <section id="view-account" class="view-section">
                <h2>АККАУНТ</h2>
                <button class="action-btn" style="background:#e74c3c; width:100%;" onclick="logout()">ВЫЙТИ</button>
            </section>
        </div>

        <nav class="sidebar">
            <button class="menu-item active" onclick="switchTab('home', this)">главная</button>
            <button class="menu-item" onclick="switchTab('forum', this)">чаты</button>
            <button class="menu-item" onclick="switchTab('anon', this)">анонимные чаты</button>
            <button class="menu-item" onclick="switchTab('profile', this)">профиль</button>
            <button class="menu-item" onclick="switchTab('account', this)">аккаунт</button>
            <button class="menu-item" onclick="window.open('https://www.donationalerts.com/r/mahovik')">донат</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onChildAdded, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7kRyiPzIAACu2RbUhl02oHdOVU8rltx8",
            authDomain: "bigfamily-9c7c9.firebaseapp.com",
            databaseURL: "https://bigfamily-9c7c9-default-rtdb.firebaseio.com",
            projectId: "bigfamily-9c7c9",
            storageBucket: "bigfamily-9c7c9.firebasestorage.app",
            messagingSenderId: "335887032766",
            appId: "1:335887032766:web:0767c05060af85723799ef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let activeChatId = null;

        // АВТОРИЗАЦИЯ
        window.handleAuth = async (type) => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const nick = document.getElementById('auth-nick').value;

            try {
                if(type === 'reg') {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await set(ref(db, 'users/' + res.user.uid), { nick: nick, email: email, avatar: 'https://via.placeholder.com/150' });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(e) { alert("Ошибка: " + e.message); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await get(ref(db, 'users/' + user.uid));
                currentUser = { uid: user.uid, ...snap.val() };
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('u-nick').innerText = currentUser.nick;
                document.getElementById('u-email').innerText = currentUser.email;
                document.getElementById('u-avatar').src = currentUser.avatar;
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        window.logout = () => signOut(auth);

        // ОБЩИЙ ЧАТ
        window.sendGlobalMsg = () => {
            const inp = document.getElementById('forum-input');
            if(!inp.value) return;
            push(ref(db, 'forum'), { user: currentUser.nick, text: inp.value });
            inp.value = '';
        };

        onChildAdded(ref(db, 'forum'), (s) => {
            const d = s.val();
            const box = document.getElementById('forum-msgs');
            const side = d.user === currentUser.nick ? 'my' : 'other';
            box.innerHTML += `<div class="bubble ${side}"><b>${d.user}</b><br>${d.text}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        // ВКЛАДКИ
        window.switchTab = (id, el) => {
            document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
        };

        window.updateAvatar = () => {
            const url = document.getElementById('avatar-input').value;
            if(url) {
                update(ref(db, 'users/' + currentUser.uid), { avatar: url });
                document.getElementById('u-avatar').src = url;
            }
        };
        
        // Посты пастыря
        onChildAdded(ref(db, 'pastor_posts'), (s) => {
            const p = s.val();
            document.getElementById('pastor-feed').insertAdjacentHTML('afterbegin', `
                <div style="background:var(--card); padding:15px; border-radius:10px; margin-bottom:15px;">
                    ${p.imgUrl ? `<img src="${p.imgUrl}" style="width:100%; border-radius:8px;">` : ''}
                    <p>${p.text}</p>
                </div>`);
        });

    </script>
</body>
</html>
