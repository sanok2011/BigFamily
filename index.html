<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A BIG FAMILY</title>
    
    <style>
        :root {
            --bg-color: #0e1621;
            --header-color: #17212b;
            --my-msg: #2b5278;
            --other-msg: #182533;
            --accent: #4eb1f3;
            --text: #ffffff;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg-color); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        /* Экран входа */
        #auth-screen {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .auth-input {
            background: #1d2a39; border: 1px solid var(--accent);
            color: white; padding: 12px; border-radius: 8px; width: 250px; text-align: center;
            font-size: 1rem; outline: none;
        }

        /* Шапка */
        .header {
            height: 56px; background: var(--header-color);
            display: flex; align-items: center; padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative; z-index: 10;
        }

        /* Зона сообщений */
        #chat-container {
            height: calc(100vh - 120px);
            overflow-y: auto; display: flex; flex-direction: column;
            padding: 10px 15px; gap: 8px;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-size: cover;
        }

        .bubble {
            padding: 8px 12px; border-radius: 15px;
            max-width: 85%; position: relative;
            font-size: 0.95rem; line-height: 1.3;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .my { align-self: flex-end; background: var(--my-msg); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: var(--other-msg); border-bottom-left-radius: 4px; }

        .author { color: var(--accent); font-size: 0.8rem; font-weight: bold; margin-bottom: 2px; }
        .time { font-size: 0.7rem; opacity: 0.6; text-align: right; margin-top: 4px; }

        /* Панель ввода */
        .input-bar {
            height: 64px; background: var(--header-color);
            display: flex; align-items: center; padding: 0 10px;
            position: fixed; bottom: 0; width: 100%; box-sizing: border-box;
        }
        #msg-input {
            flex: 1; background: transparent; border: none;
            color: white; padding: 10px; font-size: 1rem; outline: none;
        }
        .send-btn { color: var(--accent); font-weight: bold; cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h2 style="margin-bottom: 20px;">A BIG FAMILY</h2>
        <input type="text" id="username" class="auth-input" placeholder="Введите ваше имя...">
        <button onclick="startApp()" style="margin-top:20px; background: var(--accent); border:none; padding:10px 30px; border-radius:8px; color:white; font-weight:bold;">ВОЙТИ</button>
    </div>

    <div class="header">
        <div style="width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">B</div>
        <div style="margin-left: 15px;">
            <div style="font-size: 1rem; font-weight: bold;">A BIG FAMILY</div>
            <div style="font-size: 0.75rem; color: var(--accent);">онлайн</div>
        </div>
    </div>

    <div id="chat-container"></div>

    <div class="input-bar">
        <input type="text" id="msg-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <div class="send-btn" onclick="sendMessage()">ОТПРАВИТЬ</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Твои конфиги
        const firebaseConfig = {
            apiKey: "AIzaSyB7kRyiPzIAACu2RbUhl02oHdOVU8rltx8",
            authDomain: "bigfamily-9c7c9.firebaseapp.com",
            databaseURL: "https://bigfamily-9c7c9-default-rtdb.firebaseio.com",
            projectId: "bigfamily-9c7c9",
            storageBucket: "bigfamily-9c7c9.firebasestorage.app",
            messagingSenderId: "335887032766",
            appId: "1:335887032766:web:0767c05060af85723799ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'chat_messages');

        let currentUser = localStorage.getItem('chat_user') || "";

        window.startApp = () => {
            const name = document.getElementById('username').value;
            if(name) {
                localStorage.setItem('chat_user', name);
                location.reload();
            }
        };

        if(currentUser) {
            document.getElementById('auth-screen').style.display = 'none';
        }

        window.sendMessage = () => {
            const input = document.getElementById('msg-input');
            if(!input.value.trim()) return;

            const newMsgRef = push(messagesRef);
            set(newMsgRef, {
                user: currentUser,
                text: input.value,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            input.value = '';
        };

        // Слушаем новые сообщения (Realtime)
        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const container = document.getElementById('chat-container');
            const isMy = msg.user === currentUser;

            container.innerHTML += `
                <div class="bubble ${isMy ? 'my' : 'other'}">
                    ${!isMy ? `<div class="author">${msg.user}</div>` : ''}
                    <div>${msg.text}</div>
                    <div class="time">${msg.time}</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
