<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A BIG FAMILY | Network</title>
    <style>
        :root { --bg: #1a1a1a; --card: #2a2a2a; --accent: #4eb1f3; --text: #e0e0e0; --sidebar-w: 280px; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
        .container { display: grid; grid-template-columns: 1fr var(--sidebar-w); width: 100%; height: 100vh; }
        
        /* КОНТЕНТ */
        .content-area { overflow-y: auto; background: #222; position: relative; }
        .view-section { display: none; height: 100%; animation: fadeIn 0.3s; }
        .view-section.active { display: flex; flex-direction: column; }

        /* АНОНИМНЫЕ ЧАТЫ (ДВЕ ПАНЕЛИ) */
        .anon-layout { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
        .friends-list { background: #151515; border-right: 1px solid #333; padding: 10px; overflow-y: auto; }
        .friend-item { padding: 12px; background: #222; margin-bottom: 5px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
        .friend-item:hover { background: #333; }
        
        /* ЧАТ */
        .chat-wrap { display: flex; flex-direction: column; flex: 1; background: #1a1a1a; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .input-wrap { padding: 15px; background: #222; display: flex; gap: 10px; }
        input { flex: 1; background: #333; border: none; padding: 12px; color: white; border-radius: 4px; outline: none; }
        
        .bubble { padding: 8px 12px; border-radius: 10px; max-width: 80%; font-size: 0.9rem; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .my { align-self: flex-end; background: #2b5278; }
        .other { align-self: flex-start; background: #333; }

        /* МЕНЮ */
        .sidebar { background: #111; display: flex; flex-direction: column; padding: 20px; gap: 12px; border-left: 1px solid #333; }
        .menu-item { background: #222; padding: 18px; border-radius: 4px; cursor: pointer; border: none; color: #888; text-align: left; font-size: 1rem; }
        .menu-item.active { background: #2b5278; color: #fff; border: 1px solid var(--accent); }

        /* РЕГИСТРАЦИЯ */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { position: fixed; bottom: 0; width: 100%; height: 65px; flex-direction: row; padding: 0; }
            .anon-layout { grid-template-columns: 100px 1fr; }
            .content-area { height: calc(100vh - 65px); }
        }
    </style>
</head>
<body>

    <div id="auth-screen" style="display: none;">
        <h1 style="color:var(--accent)">A BIG FAMILY</h1>
        <p>Создайте аккаунт в братстве</p>
        <input type="text" id="reg-nick" placeholder="Никнейм" style="width:250px; margin-bottom:10px;">
        <button onclick="register()" style="padding:10px 40px; background:var(--accent); border:none; border-radius:5px; font-weight:bold;">СОЗДАТЬ</button>
    </div>

    <div class="container">
        <div class="content-area">
            <section id="view-home" class="view-section active" style="padding:20px;">
                <div id="pastor-feed"></div>
            </section>

            <section id="view-anon" class="view-section">
                <div class="anon-layout">
                    <div class="friends-list">
                        <input type="text" id="search-friend" placeholder="+ Найти друга (ник)" style="font-size:0.8rem; margin-bottom:10px;" onkeypress="if(event.key==='Enter') addFriend()">
                        <div id="friends-container"></div>
                    </div>
                    <div class="chat-wrap">
                        <div id="chat-target-name" style="padding:10px; background:#222; font-size:0.8rem; color:var(--accent)">Выберите чат</div>
                        <div class="messages" id="private-msgs"></div>
                        <div class="input-wrap">
                            <input type="text" id="private-input" placeholder="Сообщение...">
                            <button onclick="sendPrivate()" style="background:var(--accent); border:none; color:black; padding:10px 15px; border-radius:4px;">-></button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-community" class="view-section" style="padding:20px;"><h2>Скоро...</h2></section>
        </div>

        <nav class="sidebar">
            <button class="menu-item active" onclick="switchTab('home', this)">чаты</button>
            <button class="menu-item" onclick="switchTab('anon', this)">анонимные чаты</button>
            <button class="menu-item" onclick="switchTab('community', this)">сообщество</button>
            <button class="menu-item" onclick="switchTab('account', this)">аккаунт</button>
            <button class="menu-item" onclick="switchTab('profile', this)">профиль</button>
            <button class="menu-item" onclick="switchTab('donate', this)">донат</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onChildAdded, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7kRyiPzIAACu2RbUhl02oHdOVU8rltx8",
            authDomain: "bigfamily-9c7c9.firebaseapp.com",
            databaseURL: "https://bigfamily-9c7c9-default-rtdb.firebaseio.com",
            projectId: "bigfamily-9c7c9",
            storageBucket: "bigfamily-9c7c9.firebasestorage.app",
            messagingSenderId: "335887032766",
            appId: "1:335887032766:web:0767c05060af85723799ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myNick = localStorage.getItem('chat_user');
        let currentChatId = null;

        if(!myNick) { document.getElementById('auth-screen').style.display = 'flex'; }

        // Регистрация
        window.register = () => {
            const nick = document.getElementById('reg-nick').value.trim();
            if(nick) {
                set(ref(db, 'users/' + nick), { registered: true });
                localStorage.setItem('chat_user', nick);
                location.reload();
            }
        };

        // Переключение вкладок
        window.switchTab = (id, el) => {
            document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
        };

        // Добавление друга и создание чата
        window.addFriend = async () => {
            const nick = document.getElementById('search-friend').value.trim();
            const snapshot = await get(child(ref(db), `users/${nick}`));
            if(snapshot.exists() && nick !== myNick) {
                const chatId = [myNick, nick].sort().join("_");
                renderFriend(nick, chatId);
                document.getElementById('search-friend').value = '';
            } else { alert("Пользователь не найден"); }
        };

        function renderFriend(nick, chatId) {
            const container = document.getElementById('friends-container');
            const div = document.createElement('div');
            div.className = 'friend-item';
            div.innerText = nick;
            div.onclick = () => openPrivateChat(chatId, nick);
            container.appendChild(div);
        }

        window.openPrivateChat = (chatId, nick) => {
            currentChatId = chatId;
            document.getElementById('chat-target-name').innerText = "Чат с: " + nick;
            const msgBox = document.getElementById('private-msgs');
            msgBox.innerHTML = '';
            
            // Слушаем сообщения именно этого чата
            onChildAdded(ref(db, 'direct_messages/' + chatId), (snap) => {
                const data = snap.val();
                const side = data.user === myNick ? 'my' : 'other';
                msgBox.innerHTML += `<div class="bubble ${side}"><b>${data.user}</b><br>${data.text}</div>`;
                msgBox.scrollTop = msgBox.scrollHeight;
            });
        };

        window.sendPrivate = () => {
            if(!currentChatId) return;
            const inp = document.getElementById('private-input');
            if(!inp.value.trim()) return;

            push(ref(db, 'direct_messages/' + currentChatId), {
                user: myNick,
                text: inp.value,
                time: new Date().toLocaleTimeString()
            });
            inp.value = '';
        };

        // Лента пастыря
        onChildAdded(ref(db, 'pastor_posts'), (snap) => {
            const post = snap.val();
            document.getElementById('pastor-feed').insertAdjacentHTML('afterbegin', `
                <div class="pastor-post">
                    <b>Пастырь</b><br>
                    ${post.imgUrl ? `<img src="${post.imgUrl}" class="post-img">` : ''}
                    <p>${post.text}</p>
                </div>`);
        });
    </script>
</body>
</html>
