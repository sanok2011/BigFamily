<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A BIG FAMILY | Network</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #333333;
            --accent: #4eb1f3;
            --text: #e0e0e0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* ОСНОВНАЯ СЕТКА (КАК НА ФОТО) */
        .container {
            display: grid;
            grid-template-columns: 1fr 300px; /* Лента и Меню */
            width: 100%;
            gap: 2px;
        }

        /* ЛЕВАЯ ЧАСТЬ - ЛЕНТА ПАСТЫРЯ */
        .feed {
            overflow-y: auto;
            padding: 20px;
            background: #222;
        }

        .pastor-post {
            background: var(--card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 50px; height: 50px;
            background: #555; border-radius: 50%;
            margin-bottom: 10px;
        }

        .post-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 4px;
            margin: 10px 0;
            background: #111;
        }

        /* ПРАВАЯ ЧАСТЬ - МЕНЮ */
        .sidebar {
            background: #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        .menu-item {
            background: #3d3d3d;
            padding: 15px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            text-transform: lowercase;
            font-size: 1.1rem;
            color: #aaa;
            border: none;
        }

        .menu-item:hover { background: #444; color: #fff; }
        .menu-item.active { background: #4eb1f3; color: #000; font-weight: bold; }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed; bottom: 0; width: 100%;
                flex-direction: row; height: 60px;
                padding: 0; gap: 0; overflow-x: auto;
            }
            .menu-item {
                flex: 1; border-radius: 0; font-size: 0.7rem;
                padding: 10px 5px; text-align: center;
            }
            .feed { height: calc(100vh - 60px); }
        }

        /* СКРЫТЫЕ ОКНА (ЧАТЫ И Т.Д.) */
        .modal-content { display: none; }
        .modal-content.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="feed" id="main-feed">
            <div class="pastor-post">
                <div class="avatar"></div>
                <div style="font-weight: bold; color: var(--accent);">Пастырь</div>
                <img src="https://images.unsplash.com/photo-1511367461989-f85a21fda167?w=500" class="post-img">
                <p>Добро пожаловать в нашу цифровую обитель. Здесь только важные мысли и URL-фотографии.</p>
                <small style="opacity: 0.5;">Сегодня, 12:00</small>
            </div>
            
            <div id="dynamic-content" class="modal-content">
                <h2 id="view-title"></h2>
                <div id="view-body"></div>
            </div>
        </div>

        <div class="sidebar">
            <button class="menu-item active" onclick="showView('home')">чаты</button>
            <button class="menu-item" onclick="showView('anon')">анонимные чаты</button>
            <button class="menu-item" onclick="showView('community')">сообщество</button>
            <button class="menu-item" onclick="showView('account')">аккаунт</button>
            <button class="menu-item" onclick="showView('profile')">профиль</button>
            <button class="menu-item" onclick="showView('donate')">донат</button>
        </div>
    </div>

    <script type="module">
        // ТУТ ТВОЯ ЛОГИКА FIREBASE (как в прошлом сообщении)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7kRyiPzIAACu2RbUhl02oHdOVU8rltx8",
            authDomain: "bigfamily-9c7c9.firebaseapp.com",
            databaseURL: "https://bigfamily-9c7c9-default-rtdb.firebaseio.com",
            projectId: "bigfamily-9c7c9",
            storageBucket: "bigfamily-9c7c9.firebasestorage.app",
            messagingSenderId: "335887032766",
            appId: "1:335887032766:web:0767c05060af85723799ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Переключение вкладок
        window.showView = (view) => {
            const feed = document.getElementById('main-feed');
            const items = document.querySelectorAll('.menu-item');
            
            items.forEach(i => i.classList.remove('active'));
            event.target.classList.add('active');

            // Если кликаем не на главную, можно подгружать чаты поверх или вместо ленты
            console.log("Переход в раздел:", view);
        };

        // Загрузка постов пастыря из БД (только чтение)
        const pastorRef = ref(db, 'pastor_posts');
        onChildAdded(pastorRef, (snapshot) => {
            const post = snapshot.val();
            const feed = document.getElementById('main-feed');
            // Добавляем новые посты наверх
            const postHtml = `
                <div class="pastor-post">
                    <div class="avatar"></div>
                    <div style="font-weight: bold; color: var(--accent);">Пастырь</div>
                    ${post.imgUrl ? `<img src="${post.imgUrl}" class="post-img">` : ''}
                    <p>${post.text}</p>
                    <small style="opacity: 0.5;">${post.time}</small>
                </div>`;
            feed.insertAdjacentHTML('afterbegin', postHtml);
        });
    </script>
</body>
</html>
