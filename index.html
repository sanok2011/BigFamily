<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A BIG FAMILY</title>
    <style>
        :root { --bg: #0e1621; --card: #17212b; --accent: #4eb1f3; --text: #f5f5f5; --sidebar-w: 250px; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
        .container { display: grid; grid-template-columns: 1fr var(--sidebar-w); width: 100%; height: 100vh; }

        /* КОНТЕНТ */
        .content-area { overflow-y: auto; background: #0e1621; position: relative; }
        .view-section { display: none; height: 100%; padding: 20px; box-sizing: border-box; }
        .view-section.active { display: flex; flex-direction: column; }

        /* МЕНЮ (СПРАВА) */
        .sidebar { background: #17212b; display: flex; flex-direction: column; padding: 15px; gap: 10px; border-left: 1px solid #000; }
        .menu-item { background: #242f3d; padding: 15px; border-radius: 8px; cursor: pointer; border: none; color: #888; text-align: left; font-size: 1rem; transition: 0.2s; }
        .menu-item.active { background: #2b5278; color: #fff; }

        /* ЧАТЫ И ФОРУМ */
        .chat-wrap { display: flex; flex-direction: column; flex: 1; background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden; margin-top: 10px; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input-wrap { padding: 15px; background: #17212b; display: flex; gap: 10px; }
        input, button.action-btn { background: #242f3d; border: 1px solid #333; padding: 12px; color: white; border-radius: 8px; outline: none; }
        button.action-btn { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }

        .bubble { padding: 10px; border-radius: 10px; max-width: 85%; }
        .my { align-self: flex-end; background: #2b5278; }
        .other { align-self: flex-start; background: #182533; }

        /* ПРОФИЛЬ */
        .profile-card { text-align: center; background: var(--card); padding: 30px; border-radius: 20px; }
        .avatar-lg { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 15px; }

        /* МОБИЛКИ */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { position: fixed; bottom: 0; width: 100%; height: 70px; flex-direction: row; padding: 5px; border-left: none; border-top: 1px solid #000; z-index: 100; }
            .menu-item { flex: 1; font-size: 0.6rem; padding: 5px; text-align: center; }
            .content-area { height: calc(100vh - 70px); }
        }
    </style>
</head>
<body>

    <div id="auth-screen" style="position:fixed; inset:0; background:var(--bg); z-index:2000; display:none; flex-direction:column; align-items:center; justify-content:center;">
        <h1 style="color:var(--accent)">A BIG FAMILY</h1>
        <input type="text" id="reg-nick" placeholder="Ваш никнейм" style="width:280px; margin-bottom:10px; background:#17212b; border:1px solid var(--accent); color:white; padding:12px; border-radius:8px;">
        <button onclick="register()" style="width:300px; padding:15px; background:var(--accent); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">СОЗДАТЬ АККАУНТ / ВОЙТИ</button>
    </div>

    <div class="container">
        <div class="content-area">
            
            <section id="view-home" class="view-section active">
                <h2 style="color:var(--accent)">СЛОВО ПАСТЫРЯ</h2>
                <div id="pastor-feed"></div>
            </section>

            <section id="view-forum" class="view-section">
                <h2>ОБЩИЙ ФОРУМ</h2>
                <div class="chat-wrap">
                    <div class="messages" id="forum-msgs"></div>
                    <div class="input-wrap">
                        <input type="text" id="forum-input" placeholder="Написать всем...">
                        <button onclick="sendMsg('forum')" class="action-btn">-></button>
                    </div>
                </div>
            </section>

            <section id="view-anon" class="view-section" style="padding:0;">
                <div style="display:grid; grid-template-columns: 200px 1fr; height:100%;">
                    <div style="background:#111; padding:10px; border-right:1px solid #333;">
                        <input type="text" id="find-user" placeholder="Ник друга" style="width:90%; font-size:0.8rem;">
                        <button onclick="addFriend()" style="width:100%; margin-top:5px; font-size:0.7rem;">Найти</button>
                        <div id="friends-list" style="margin-top:20px;"></div>
                    </div>
                    <div class="chat-wrap" style="margin:0;">
                        <div id="chat-with" style="padding:10px; background:#17212b; font-size:0.8rem;">Выберите диалог</div>
                        <div class="messages" id="anon-msgs"></div>
                        <div class="input-wrap">
                            <input type="text" id="anon-input" placeholder="Личное сообщение...">
                            <button onclick="sendPrivate()" class="action-btn">-></button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-profile" class="view-section">
                <div class="profile-card">
                    <img id="p-avatar" src="https://via.placeholder.com/150" class="avatar-lg">
                    <h2 id="p-nick">Username</h2>
                    <input type="text" id="avatar-url" placeholder="URL новой аватарки" style="width:80%;">
                    <button onclick="updateAvatar()" class="action-btn" style="margin-top:10px;">ОБНОВИТЬ ФОТО</button>
                </div>
            </section>

            <section id="view-account" class="view-section">
                <h2>УПРАВЛЕНИЕ АККАУНТОМ</h2>
                <div class="profile-card" style="text-align:left;">
                    <p>Вы вошли как: <b id="acc-name"></b></p>
                    <button onclick="logout()" style="background:#e74c3c; width:100%;" class="action-btn">ВЫЙТИ ИЗ АККАУНТА</button>
                    <button onclick="showAuth()" style="background:var(--accent); width:100%; margin-top:10px;" class="action-btn">ВОЙТИ В ДРУГОЙ</button>
                </div>
            </section>

        </div>

        <nav class="sidebar">
            <button class="menu-item" onclick="switchTab('home', this)">главная</button>
            <button class="menu-item" onclick="switchTab('forum', this)">чаты</button>
            <button class="menu-item" onclick="switchTab('anon', this)">анонимные чаты</button>
            <button class="menu-item" onclick="switchTab('community', this)">сообщество</button>
            <button class="menu-item" onclick="switchTab('account', this)">аккаунт</button>
            <button class="menu-item" onclick="switchTab('profile', this)">профиль</button>
            <button class="menu-item" onclick="window.open('https://www.donationalerts.com/r/mahovik', '_blank')">донат</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onChildAdded, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7kRyiPzIAACu2RbUhl02oHdOVU8rltx8",
            authDomain: "bigfamily-9c7c9.firebaseapp.com",
            databaseURL: "https://bigfamily-9c7c9-default-rtdb.firebaseio.com",
            projectId: "bigfamily-9c7c9",
            storageBucket: "bigfamily-9c7c9.firebasestorage.app",
            messagingSenderId: "335887032766",
            appId: "1:335887032766:web:0767c05060af85723799ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myNick = localStorage.getItem('chat_user');
        let currentPrivChat = null;

        // Инициализация
        if(!myNick) { showAuth(); } else { loadProfile(); }

        function showAuth() { document.getElementById('auth-screen').style.display = 'flex'; }
        window.register = () => {
            const n = document.getElementById('reg-nick').value.trim();
            if(n) {
                set(ref(db, 'users/' + n), { nick: n, avatar: 'https://via.placeholder.com/150' });
                localStorage.setItem('chat_user', n);
                location.reload();
            }
        };

        window.logout = () => { localStorage.clear(); location.reload(); };

        function loadProfile() {
            document.getElementById('acc-name').innerText = myNick;
            document.getElementById('p-nick').innerText = myNick;
            get(ref(db, 'users/' + myNick)).then(s => {
                if(s.exists()) document.getElementById('p-avatar').src = s.val().avatar;
            });
        }

        window.updateAvatar = () => {
            const url = document.getElementById('avatar-url').value;
            if(url) {
                update(ref(db, 'users/' + myNick), { avatar: url });
                document.getElementById('p-avatar').src = url;
            }
        };

        // ВКЛАДКИ
        window.switchTab = (id, el) => {
            document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById('view-' + id);
            if(target) target.classList.add('active');
        };

        // ОБЩИЙ ФОРУМ
        window.sendMsg = (type) => {
            const inp = document.getElementById('forum-input');
            if(!inp.value) return;
            push(ref(db, 'forum'), { user: myNick, text: inp.value, time: new Date().toLocaleTimeString() });
            inp.value = '';
        };
        onChildAdded(ref(db, 'forum'), s => renderBubble(s.val(), 'forum-msgs'));

        // АНОН ЧАТЫ
        window.addFriend = async () => {
            const nick = document.getElementById('find-user').value;
            const s = await get(ref(db, 'users/' + nick));
            if(s.exists() && nick !== myNick) {
                const id = [myNick, nick].sort().join("_");
                const btn = document.createElement('div');
                btn.className = 'menu-item';
                btn.innerText = nick;
                btn.onclick = () => {
                    currentPrivChat = id;
                    document.getElementById('chat-with').innerText = "Чат с " + nick;
                    document.getElementById('anon-msgs').innerHTML = '';
                    onChildAdded(ref(db, 'priv/' + id), snap => renderBubble(snap.val(), 'anon-msgs'));
                };
                document.getElementById('friends-list').appendChild(btn);
            }
        };

        window.sendPrivate = () => {
            if(!currentPrivChat) return;
            const inp = document.getElementById('anon-input');
            push(ref(db, 'priv/' + currentPrivChat), { user: myNick, text: inp.value });
            inp.value = '';
        };

        // ЛЕНТА ПАСТЫРЯ
        onChildAdded(ref(db, 'pastor_posts'), s => {
            const p = s.val();
            document.getElementById('pastor-feed').insertAdjacentHTML('afterbegin', `
                <div style="background:var(--card); padding:15px; border-radius:10px; margin-bottom:15px;">
                    ${p.imgUrl ? `<img src="${p.imgUrl}" style="width:100%; border-radius:8px;">` : ''}
                    <p>${p.text}</p>
                </div>`);
        });

        function renderBubble(d, id) {
            const b = document.getElementById(id);
            const isMy = d.user === myNick;
            b.innerHTML += `<div class="bubble ${isMy?'my':'other'}"><b>${d.user}</b><br>${d.text}</div>`;
            b.scrollTop = b.scrollHeight;
        }
    </script>
</body>
</html>
